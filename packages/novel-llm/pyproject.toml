[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "novel-llm"
version = "0.1.0"
description = "Shared LLM provider interfaces and direct backends for book services"
requires-python = ">=3.12"
dependencies = [
  "anthropic>=0.40",
  "httpx>=0.27",
  "grpcio>=1.83",
  "grpcio-status>=1.83",
  "protobuf>=5.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "grpcio-tools>=1.83"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]
