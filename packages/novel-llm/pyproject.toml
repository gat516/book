[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "novel-llm"
version = "0.1.0"
description = "Shared LLM provider interfaces and direct backends for book services"
requires-python = ">=3.12"
dependencies = [
  "anthropic>=0.40",
  "httpx>=0.27",
]

[tool.setuptools.packages.find]
where = ["src"]
