// Pinned copy of ../llm-inference-gateway/api/proto/gateway.proto.
syntax = "proto3";
package llmgw.v1;

service Gateway {
  rpc Complete(CompletionRequest) returns (stream CompletionChunk);
  rpc Embed(EmbedRequest) returns (EmbedReply);
}

enum PriorityClass { INTERACTIVE = 0; BATCH = 1; }
enum BackendType { HOSTED = 0; HOSTED_BATCH = 1; LOCAL_GPU = 2; }
enum MessageRole { USER = 0; ASSISTANT = 1; }
enum CompletionChunkKind { TEXT = 0; REFUSAL = 1; FINISH = 2; USAGE = 3; }

message EmbedRequest {
  string tenant = 1;
  string provider = 2;
  string model = 3;
  BackendType backend = 4;
  PriorityClass priority = 5;
  repeated string inputs = 6;
  bool no_fallback = 7;
}
message EmbedReply {
  message Vector { repeated float values = 1; }
  repeated Vector embeddings = 1;
  string served_provider = 2;
  string served_model = 3;
  uint32 total_input_tokens = 4;
}
message CompletionMessage { MessageRole role = 1; string content = 2; }
message CompletionRequest {
  string tenant = 1;
  string provider = 2;
  string model = 3;
  BackendType backend = 4;
  PriorityClass priority = 5;
  string system = 6;
  repeated CompletionMessage messages = 7;
  uint32 max_output_tokens = 8;
  bool no_fallback = 9;
  bool json_mode = 10;
}
message CompletionChunk {
  CompletionChunkKind kind = 1;
  string id = 2;
  string request_id = 3;
  string served_provider = 4;
  string served_model = 5;
  string text = 6;
  string finish_reason = 7;
  string raw_finish_reason = 8;
  uint32 input_tokens = 9;
  uint32 cache_write_tokens = 10;
  uint32 cache_read_tokens = 11;
  uint32 output_tokens = 12;
}
