services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_PASSWORD: test-only-password
      POSTGRES_DB: novel_engine
    ports: ["127.0.0.1:56432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d novel_engine"]
      interval: 2s
      timeout: 3s
      retries: 30
  redis:
    image: redis:7.4-alpine
    ports: ["127.0.0.1:56389:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30
  objects:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data
    environment:
      MINIO_ROOT_USER: booktest
      MINIO_ROOT_PASSWORD: test-only-secret
    ports: ["127.0.0.1:59010:9000"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 2s
      timeout: 3s
      retries: 30
