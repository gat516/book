# Optional systemd drop-in for this 16 GB Intel iGPU host.
# Install under /run/systemd/system/ollama.service.d/ for a temporary trial.
# Requires administrator access and an idle Ollama service; not applied by Book.
[Service]
Environment="OLLAMA_IGPU_ENABLE=1"
Environment="OLLAMA_NUM_PARALLEL=1"
Environment="OLLAMA_MAX_LOADED_MODELS=1"
