# Local dev infrastructure for the novel-engine (Milestone 1, step 1).
# Brings up the single source of truth (Postgres 16 + pgvector), the job queue
# (Redis), and object storage (MinIO). Application services are added later.
#
#   docker compose -f deploy/docker-compose.yml up -d
#   ./db/migrate.sh          # apply db/migrations in order
#
services:
  postgres:
    # pgvector image ships Postgres 16 with the `vector` extension preinstalled.
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: engine
      POSTGRES_PASSWORD: engine
      POSTGRES_DB: novel_engine
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U engine -d novel_engine"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio12345
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # web console
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  textproc:
    build:
      context: ..
      dockerfile: services/textproc/Dockerfile
    environment:
      TEXTPROC_LISTEN_ADDR: 0.0.0.0:50051
      TEXTPROC_MATCHER_CACHE_CAPACITY: 128
    ports:
      - "50051:50051"

volumes:
  pgdata:
  redisdata:
  miniodata:
