map $uri $book_cache_control {
  default "no-cache";
  ~^/assets/ "public, max-age=31536000, immutable";
  ~^/api/ "private, no-store";
}
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  client_max_body_size 4m;
  add_header Referrer-Policy no-referrer always;
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Cache-Control $book_cache_control always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self' https://accounts.google.com" always;
  location /api/ {
    proxy_pass http://reader-api:8081/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Account-ID "";
    proxy_set_header X-Reader-ID "";
    proxy_read_timeout 570s;
    proxy_buffering off;
    proxy_hide_header Cache-Control;
  }
  location /assets/ { try_files $uri =404; }
  location / { try_files $uri /index.html; }
  location = /healthz { access_log off; return 200 'ok'; }
}
