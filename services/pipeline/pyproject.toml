[project]
name = "pipeline"
version = "0.1.0"
description = "Offline ingestion pipeline: drains jobs:pending, turns chapters into the knowledge graph (instructions.md §5)."
requires-python = ">=3.12"
dependencies = [
    "psycopg[binary]>=3.2",
    "redis>=5.0",
    "minio>=7.2",
    "pydantic>=2.7",
    "novel-llm>=0.1.0",
    "pgvector>=0.3",
    # Mention scanning (§3.3). Stands in for the Rust `textproc` service until Phase 4;
    # its iter_long() is the leftmost-longest mode the aho-corasick crate calls
    # MatchKind::LeftmostLongest, so the swap keeps the same match semantics.
    "pyahocorasick>=2.1",
    "grpcio>=1.83",
    "protobuf>=7.35",
    # Decrypts novel_provider_config.api_key_cipher (PLAN.md Phase N4) — AES-GCM,
    # matching services/ingest-api/crypto.go's stdlib crypto/aes+cipher encryption.
    "cryptography>=42",
    # Deterministic Hanzi -> Hanyu Pinyin candidates for source-anchored character names.
    # Simplified <-> Traditional conversion: a model may write a name in the other script
    # from the source's (星莲 for 星蓮); names are checked and stored in the source's form.
    "opencc-python-reimplemented>=0.1.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "grpcio-tools>=1.83",
    "grpcio-health-checking>=1.83",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "db: needs a live Postgres (db_conn fixture skips cleanly if unreachable)",
]

[tool.setuptools.packages.find]
include = ["pipeline*"]

# Versioned stage prompts ship with the code; a prompt's file name is its version.
[tool.setuptools.package-data]
pipeline = ["prompts/*.txt"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
