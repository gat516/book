[project]
name = "pipeline"
version = "0.1.0"
description = "Offline ingestion pipeline: drains jobs:pending, turns chapters into the knowledge graph (instructions.md §5)."
requires-python = ">=3.12"
dependencies = [
    "psycopg[binary]>=3.2",
    "redis>=5.0",
    "minio>=7.2",
    "httpx>=0.27",
    "pydantic>=2.7",
    "anthropic>=0.69",
    "pgvector>=0.3",
    # Mention scanning (§3.3). Stands in for the Rust `textproc` service until Phase 4;
    # its iter_long() is the leftmost-longest mode the aho-corasick crate calls
    # MatchKind::LeftmostLongest, so the swap keeps the same match semantics.
    "pyahocorasick>=2.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "db: needs a live Postgres (db_conn fixture skips cleanly if unreachable)",
]

[tool.setuptools.packages.find]
include = ["pipeline*"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
